# Brew recipe library — drives the calculator (/tools/brew-calculator/) and the
# "Recipe library" section on each method page. Researched 2026-10-22 from the
# sources linked on each recipe; nothing estimated. See README §6.6 for the schema.
#
# Per recipe:
#   dose / water   reference recipe in grams; the calculator scales to the user's dose
#   fixed: true    not scalable (drip bags, Brikka) — shows the reference recipe as-is
#   steps          `at` (mm:ss, optional), `to` (fraction 0–1 of total water, cumulative),
#                  `note`. Steps without `to` are actions (stir, press, flip…).
#   bypass         grams of water added after brewing (scaled with the dose)
#   temp, grind    shown as-is; `clicks` is the TIMEMORE C3S Pro starting range
#   confidence     high | medium | low (how well the numbers are sourced)
#   warn           shown highlighted (inverted brewing, conflicts, gear limits)

grinder:
  name: "Timemore C3S Pro"
  # TIMEMORE C3 Pro manual ("How to Adjust"); also printed on the C3S Pro dial
  official:
    - { method: "Espresso", clicks: "7–8" }
    - { method: "Pour over", clicks: "13–16" }
    - { method: "French press", clicks: "17–20" }
  avoid: "0–6 clicks (TIMEMORE: protects the burrs)"
  capacity: "20–25 g per grind — bigger doses need two runs"
  source: "https://www.timemore.com/pages/download-center"

