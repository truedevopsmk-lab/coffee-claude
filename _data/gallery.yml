# Brews & Frames gallery configuration.
# - `sections` controls the order and titles of curated albums.
# - `captions` maps an image path (leading slash, relative to site root) to its caption.
# Any /assets/gallery/<folder>/ not listed in `sections` is auto-appended at the bottom.
