<div class="page-head">
  <p class="eyebrow">Reminders</p>
  <h1>Brew Reminders</h1>
  <p>Subscribe to get the occasional nudge to log your brews and tasting notes before you forget them.</p>
</div>

<div class="card" style="max-width:560px">
  <div id="notification-status" class="status-msg loading visible" style="margin:0 0 1rem">Checking notification status…</div>
  <button id="notify-btn" class="btn btn-primary">Subscribe</button>
</div>

<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    const isPushSupported = OneSignal.Notifications.isPushSupported();
    const statusEl = document.getElementById('notification-status');
    const btn = document.getElementById('notify-btn');

    function setStatus(type, msg) {
      statusEl.className = 'status-msg ' + type + ' visible';
      statusEl.textContent = msg;
    }

    if (!isPushSupported) {
      setStatus('error', 'Push notifications are not supported in this browser.');
      btn.style.display = 'none';
      return;
    }

    const isSubscribed = await OneSignal.User.PushSubscription.optedIn;
    setStatus(isSubscribed ? 'success' : 'loading',
      isSubscribed ? '✅ You are currently subscribed to brew reminders.' : '🔔 You are not subscribed yet.');
    btn.textContent = isSubscribed ? 'Unsubscribe' : 'Subscribe';

    btn.addEventListener('click', async () => {
      if (await OneSignal.User.PushSubscription.optedIn) {
        await OneSignal.User.PushSubscription.optOut();
        setStatus('loading', '🔕 You have unsubscribed.');
        btn.textContent = 'Subscribe';
      } else {
        await OneSignal.User.PushSubscription.optIn();
        setStatus('success', '✅ You are now subscribed!');
        btn.textContent = 'Unsubscribe';
      }
    });
  });
</script>
