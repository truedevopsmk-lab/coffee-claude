title: Coffee Journal
description: A personal coffee brewing & tasting lab notebook — brews, beans, methods, and experiments.
markdown: kramdown
permalink: pretty

baseurl: /coffee-claude
url: https://truedevopsmk-lab.github.io

plugins:
  - jekyll-seo-tag

# Link previews (WhatsApp, iMessage, Slack…): jekyll-seo-tag uses this unless a page sets `image:`
defaults:
  - scope: { path: "" }
    values:
      image: /assets/og-image.jpg
twitter:
  card: summary_large_image

# Keep local tooling out of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - templates
  - scripts
