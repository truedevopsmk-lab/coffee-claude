<script>
  // Mobile nav + theme toggle
  (function () {
    var navToggle = document.querySelector('[data-nav-toggle]');
    var nav = document.getElementById('primary-nav');
    if (navToggle && nav) {
      var setOpen = function (open) {
        nav.classList.toggle('open', open);
        navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        navToggle.textContent = open ? '✕' : '☰';
      };
      navToggle.addEventListener('click', function () { setOpen(!nav.classList.contains('open')); });
      // Close on outside tap, Escape, picking a link, or returning via back/forward cache
      document.addEventListener('click', function (e) {
        if (nav.classList.contains('open') && !nav.contains(e.target) && !navToggle.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('open')) { setOpen(false); navToggle.focus(); }
      });
      nav.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
      window.addEventListener('pageshow', function () { setOpen(false); });
    }
    var themeToggle = document.querySelector('[data-theme-toggle]');
    if (themeToggle) {
      themeToggle.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        if (!current) {
          current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('cj_theme', next); } catch (e) {}
      });
    }
  })();
</script>

{% unless page.no_sw %}
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}').catch(function () {});
    });
  }
</script>
{% endunless %}
