  - key: infographs
    title: "📊 Infographs"
    folder: "/assets/gallery/Infographs/"
  - key: brewed_elsewhere
    title: "🌍 Brewed Elsewhere"
    folder: "/assets/gallery/travel/"
  - key: events
    title: "🎟 Events"
    folder: "/assets/gallery/events/"

