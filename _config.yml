title: Coffee Journal
description: A personal coffee brewing & tasting lab notebook — brews, beans, methods, and experiments.
markdown: kramdown
permalink: pretty

baseurl: /coffee-claude
url: https://truedevopsmk-lab.github.io

plugins:
  - jekyll-seo-tag

# Keep local tooling out of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - templates
